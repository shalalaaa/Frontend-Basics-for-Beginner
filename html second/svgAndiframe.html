<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG and Iframe</title>
</head>
<body>

    <h2>SVG Example</h2>

    <svg width="200" height="200" viewBox="0 0 200 200">
        <rect x="10" y="10" width="180" height="180"
              rx="15" fill="#f0f4f8"
              stroke="#334155" stroke-width="4"/>

        <circle cx="100" cy="100" r="50" fill="#3b82f6"/>

        <text x="100" y="105" font-size="16"
              fill="white" text-anchor="middle">
            SVG
        </text>
    </svg>

    <h2>Code with Harry</h2>

    <iframe
        src="https://www.codewithharry.com/"
        width="500"
        height="500"
        title="Code with Harry">
    </iframe>

    <p>
        <a href="https://www.codewithharry.com/" target="_blank">
            Open Code with Harry in new tab
        </a>
    </p>

</body>
</html>
