
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Lite</title>
</head>
<body>

    <header>
        <nav>
            <img src="image copy 3.png" height="50" alt="youtube logo">
            <h3>Youtube Lite</h3>

            <form>
                <input type="search" placeholder="Search">
                <button type="submit">Search</button>
            </form>

            <div>
                <a href="#">Sign In</a>
                <a href="#">Sign Up</a>
            </div>
        </nav>
    </header>

    <main>
        <h2>Welcome to Youtube Lite</h2>

        <form>
            <select name="Recommendation">
                <option value="study">Study</option>
                <option value="java">Java</option>
                <option value="painting">Painting</option>
                <option value="movies">Movie</option>
                <option value="goge">Gojo And Geto</option>
                <option value="chowmein">Food</option>
                <option value="art&craft">Art & Craft</option>
                <option value="webdev">Web Development</option>
            </select>
        </form>

        <h3>Categories</h3>

        <nav>
            <a href="https://www.youtube.com/embed/IlU-zDU6aQ0"
               target="video-frame">Study</a>

            <a href="https://www.youtube.com/embed/eIrMbAQSU34"
               target="video-frame">Java</a>

            <a href="https://www.youtube.com/embed/ewMksAbgdBI"
               target="video-frame">Painting</a>

            <a href="https://www.youtube.com/embed/5PSNL1qE6VY"
               target="video-frame">Movies</a>

            <a href="https://www.youtube.com/embed/9bZkp7q19f0"
               target="video-frame">Gojo And Geto</a>

            <a href="https://www.youtube.com/embed/8jLOx1hD3_o"
               target="video-frame">Food</a>

            <a href="https://www.youtube.com/embed/dQw4w9WgXcQ"
               target="video-frame">Art & Craft</a>

            <a href="https://www.youtube.com/embed/nu_pCVPKzTk"
               target="video-frame">Web Development</a>
        </nav>

        <h3>Watch Videos</h3>

        <iframe
            name="video-frame"
            width="560"
            height="315"
            src="https://www.youtube.com/embed/IlU-zDU6aQ0"
            title="YouTube video player"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </main>

</body>
</html>
